<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DEATH将棋</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    #menu {
      margin-top: 40px;
    }

    button {
      font-size: 18px;
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #gameLayout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      margin-top: 20px;
    }

    #leftPane,
    #rightPane {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #board {
      display: none;
      grid-template-columns: repeat(5, 70px);
      grid-template-rows: repeat(5, 70px);
      gap: 4px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      width: 70px;
      height: 70px;
      background: #f0d9b5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }

    .enemy {
      background: #b58863;
      color: white;
    }

    .highlight {
      border: 3px solid red;
      box-shadow: 0 0 10px red;
    }

    .player-card {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px;
      width: 320px;
      margin: 10px auto;
      background: #cfe2f3;
      border-radius: 8px;
      justify-content: center;
    }

    #status {
      font-size: 20px;
      margin-top: 10px;
      white-space: pre-line;
      font-weight: bold;
    }

    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      border-radius: 6px;
      color: white;
      background: #333;
      opacity: 0;
      transition: 0.3s;
    }

    #toast.show {
      opacity: 1;
    }

    #cameraContainer {
      margin-top: 20px;
      position: relative;
    }

    video {
      width: 400px;
      border: 2px solid black;
    }

    .camera-guide {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      pointer-events: none;
      border: 2px dashed gray;
      transition: 0.3s;
    }

    /* ⭐ アクティブ側 */
    .active-guide {
      border: 3px solid red;
      box-shadow: 0 0 10px red;
    }

    #leftGuide {
      left: 0;
    }

    #rightGuide {
      right: 0;
    }

    #captureBtn {
      font-size: 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
    }

    #captureBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #cameraHint {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    /* ===== AIデバッグ表示 ===== */
    #aiDebug {
      margin-top: 12px;
      width: 400px;
      max-width: 90vw;
      text-align: left;
      background: #111;
      color: #eaeaea;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre;
      overflow: auto;
      display: none;
    }
  </style>
</head>

<body>

<h1>DEATH将棋</h1>

<div id="menu">
  <h2>モード選択</h2>
  <button onclick="startGame('pvp')">PVP</button>
  <button onclick="startGame('npc')">NPC</button>
</div>

<button id="backBtn" onclick="backToMenu()" style="display:none;">
  メニューに戻る
</button>

<div id="gameLayout">

  <!-- ===== カメラ ===== -->
  <div id="leftPane">

    <div id="cameraContainer">
      <div id="leftGuide" class="camera-guide"></div>
      <div id="rightGuide" class="camera-guide"></div>
    </div>

    <button id="captureBtn" onclick="captureCurrentPlayer()">
      📸 撮影
    </button>

    <div id="cameraHint">
      ← プレイヤー1 ｜ プレイヤー2 →
    </div>

    <pre id="aiDebug"></pre>

  </div>

  <!-- ===== 将棋 ===== -->
  <div id="rightPane">

    <div id="topPlayerLabel" class="player-card">
      <div class="icon">👤</div>
      <div id="topName">プレイヤー2</div>
    </div>

    <div id="board"></div>

    <div id="bottomPlayerLabel" class="player-card">
      <div class="icon">👤</div>
      <div id="bottomName">プレイヤー1</div>
    </div>

  </div>

</div>

<p id="status">モードを選択してください</p>

<div id="toast"></div>

<script src="shared.js"></script>
<script src="pvpLogic.js"></script>
<script src="npcLogic.js"></script>
<script src="config.js"></script>
<script src="ai.js"></script>
<script src="camera.js"></script>
<script src="main.js"></script>

<script>
  // AIのスコア（デバッグ）表示
  window.addEventListener("ai:scores", (e) => {
    const el = document.getElementById("aiDebug");
    if (!el) return;
    const scores = e && e.detail ? e.detail : null;
    if (!scores) return;

    const order = ["歩", "金", "銀", "角", "飛"];
    const parts = order.map((k) => `${k}: ${scores[k] ?? "?"}`);
    el.textContent = `AIスコア: ${parts.join(", ")}`;
    el.style.display = "block";
    el.scrollIntoView({ block: "nearest" });
  });
</script>

</body>
</html>
