<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DEATH将棋</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    #menu {
      margin-top: 40px;
    }

    button {
      font-size: 18px;
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    /* ===== レイアウト ===== */
    #gameLayout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      margin-top: 20px;
    }

    #leftPane,
    #rightPane {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 盤面 ===== */
    #board {
      display: none;
      grid-template-columns: repeat(5, 70px);
      grid-template-rows: repeat(5, 70px);
      gap: 4px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      width: 70px;
      height: 70px;
      background: #f0d9b5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }

    .enemy {
      background: #b58863;
      color: white;
    }

    /* ===== プレイヤーカード ===== */
    .player-card {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px;
      width: 320px;
      margin: 10px auto;
      background: #cfe2f3;
      border-radius: 8px;
      justify-content: center;
    }

    .player-card .icon {
      font-size: 28px;
    }

    /* ===== ステータス ===== */
    #status {
      font-size: 20px;
      margin-top: 10px;
      white-space: pre-line;
    }

    /* ===== トースト ===== */
    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      border-radius: 6px;
      color: white;
      background: #333;
      opacity: 0;
      transition: 0.3s;
    }

    #toast.show {
      opacity: 1;
    }

    /* ===== カメラ ===== */
    #cameraContainer {
      margin-top: 20px;
    }

    video {
      width: 400px;
      border: 2px solid black;
    }
  </style>
</head>

<body>

<h1>DEATH将棋</h1>

<div id="menu">
  <h2>モード選択</h2>
  <button onclick="startGame('pvp')">PVP</button>
  <button onclick="startGame('npc')">NPC</button>
</div>

<button id="backBtn" onclick="backToMenu()" style="display:none;">
  メニューに戻る
</button>

<!-- ===== ここが重要：左右レイアウト ===== -->
<div id="gameLayout">

  <!-- 左：カメラ -->
  <div id="leftPane">
    <div id="cameraContainer"></div>

    <button onclick="testCapture('player')">右側（player）撮影</button>
    <button onclick="testCapture('enemy')">左側（enemy）撮影</button>
  </div>

  <!-- 右：将棋 -->
  <div id="rightPane">

    <div id="topPlayerLabel" class="player-card">
      <div class="icon">👤</div>
      <div id="topName">プレイヤー2</div>
    </div>

    <div id="board"></div>

    <div id="bottomPlayerLabel" class="player-card">
      <div class="icon">👤</div>
      <div id="bottomName">プレイヤー1</div>
    </div>

  </div>

</div>

<p id="status">モードを選択してください</p>

<div id="toast"></div>

<!-- 正しい順番 -->
<script src="shared.js"></script>
<script src="pvpLogic.js"></script>
<script src="npcLogic.js"></script>
<script src="config.js"></script>
<script src="ai.js"></script>
<script src="camera.js"></script>
<script src="main.js"></script>

</body>
</html>
